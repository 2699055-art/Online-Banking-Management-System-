<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <meta name="idle-minutes" content="{{ idle_minutes }}">
  <meta name="theme-color" content="#0b2f6b">
  <title>{{ title }} - BluePass</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</head>
<body data-page="{{ page }}" data-role="{{ user.role if user else '' }}">
{% include '_icons.html' %}
{% if user %}
<div class="shell">
  <header class="topbar">
    <a class="brand" href="/">
      <svg class="icon" aria-hidden="true"><use href="#i-bank"/></svg>
      <span>BluePass</span>
    </a>
    <div class="topbar-right">
      {% if user.role == 'customer' %}
      <a class="bell" href="/notifications" aria-label="Notifications">
        <svg class="icon" aria-hidden="true"><use href="#i-bell"/></svg>
        <span class="badge" id="bell-count" hidden>0</span>
      </a>
      {% endif %}
    </div>
  </header>
  <nav class="nav" aria-label="Main">
    {% for key, label, icon, href in nav %}
    <a href="{{ href }}" {% if key == page %}aria-current="page"{% endif %}>
      <svg class="icon" aria-hidden="true"><use href="#i-{{ icon }}"/></svg>
      <span>{{ label }}</span>
    </a>
    {% endfor %}
  </nav>
  <main id="main">
    {% block content %}{% endblock %}
  </main>
</div>
{% else %}
<main class="auth">
  <a class="brand brand-lg" href="/">
    <svg class="icon" aria-hidden="true"><use href="#i-bank"/></svg>
    <span>BluePass</span>
  </a>
  {% block auth %}{% endblock %}
</main>
{% endif %}
<div id="toasts" role="status" aria-live="polite"></div>
</body>
</html>
