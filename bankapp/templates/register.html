{% extends "base.html" %}
{% block auth %}
<section class="auth-card">
  <h1>Open an account</h1>
  <p class="lead">Our bank staff verify every new account before money can move.</p>
  <form id="register-form" novalidate>
    <div class="field">
      <label for="full_name">Full name</label>
      <input id="full_name" name="full_name" autocomplete="name" required>
      <p class="field-error" data-for="full_name"></p>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <p class="field-error" data-for="email"></p>
    </div>
    <div class="field">
      <label for="phone">Mobile number</label>
      <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="9876543210" required>
      <p class="field-error" data-for="phone"></p>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" required>
      <p class="hint">At least 8 characters with a letter and a number.</p>
      <p class="field-error" data-for="password"></p>
    </div>
    <div class="field">
      <label for="pin">Transaction PIN</label>
      <input id="pin" name="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off" required>
      <p class="hint">4 to 6 digits. You'll enter it to confirm every transfer.</p>
      <p class="field-error" data-for="pin"></p>
    </div>
    <p class="form-error" role="alert"></p>
    <button class="btn btn-primary btn-block" type="submit">Create account</button>
  </form>
  <p class="switch">Already registered? <a href="/login">Sign in</a></p>
</section>
{% endblock %}
